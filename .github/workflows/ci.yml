name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - ".github/state/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile
        run: python -m compileall -q mivzak tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Self-test
        run: python -m mivzak --self-test

      - name: Offline dry run (fixture data, no email)
        run: python -m mivzak --offline --dry-run --trading-date 2026-09-03 --output-dir generated

      - name: Upload the sample brief
        uses: actions/upload-artifact@v4
        with:
          name: mivzak-offline-sample-${{ github.run_id }}
          path: generated/
          if-no-files-found: error
          retention-days: 7
