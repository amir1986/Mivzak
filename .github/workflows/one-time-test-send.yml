name: One-time test brief

# Temporary: sends a single test brief for the Wednesday 2026-09-02 session
# to hellybracha@gmail.com when a commit whose message contains
# [send-test-brief] is pushed.  Delete this file once the test is done.

on:
  push:
    branches:
      - claude/daily-market-reports-8rmpcx

permissions:
  contents: read

jobs:
  send-test:
    if: contains(github.event.head_commit.message, '[send-test-brief]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Send the test brief for Wednesday 2026-09-02
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          MIVZAK_RECIPIENT: hellybracha@gmail.com
        run: python -m mivzak --role primary --trading-date 2026-09-02 --force-send --recipient hellybracha@gmail.com

      - name: Upload the generated brief
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mivzak-test-send-${{ github.run_id }}
          path: generated/
          if-no-files-found: ignore
          retention-days: 14
